---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: powerdns-recursor
  namespace: networking
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      powerdns-recursor:
        replicas: 3
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: powerdns/pdns-recursor-50
              tag: "5.0.3"
            args:
              - --local-address=0.0.0.0
              - --local-port=53
              - --allow-from=0.0.0.0/0
              - --log-common-errors=yes
              - --loglevel=4
              # Query root servers directly (like Unbound)
              - --hint-file=/usr/share/dns/root.hints
              # Enable DNSSEC validation
              - --dnssec=validate
              # Forward authoritative zones to PowerDNS Auth
              - --forward-zones=${SECRET_DEV_DOMAIN}=powerdns.networking.svc.cluster.local:53
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 53
                  initialDelaySeconds: 30
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 53
                  initialDelaySeconds: 10
                  periodSeconds: 5
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - NET_BIND_SERVICE
                drop:
                  - ALL

    service:
      app:
        controller: powerdns-recursor
        type: LoadBalancer
        ports:
          dns-tcp:
            port: 53
            protocol: TCP
          dns-udp:
            port: 53
            protocol: UDP
