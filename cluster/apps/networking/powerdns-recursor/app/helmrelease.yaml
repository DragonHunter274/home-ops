---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: powerdns-recursor
  namespace: networking
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      powerdns-recursor:
        replicas: 3
        strategy: RollingUpdate
        initContainers:
          init-forward-zones:
            image:
              repository: busybox
              tag: "1.36"
            command:
              - sh
              - -c
              - |
                # Resolve PowerDNS Auth service to IP
                AUTH_IP=$(nslookup powerdns.networking.svc.cluster.local | grep -A1 "Name:" | tail -1 | awk '{print $3}')
                if [ -z "$AUTH_IP" ]; then
                  echo "Failed to resolve powerdns.networking.svc.cluster.local"
                  exit 1
                fi
                echo "Resolved PowerDNS Auth to: $AUTH_IP"
                # Write forward zone config with IP address
                echo "+${SECRET_DEV_DOMAIN}=$AUTH_IP" > /etc/powerdns/recursor.d/forward-zones.conf
                cat /etc/powerdns/recursor.d/forward-zones.conf
        containers:
          app:
            image:
              repository: powerdns/pdns-recursor-50
              tag: "5.0.3"
            command:
              - /usr/sbin/pdns_recursor
              - --config-dir=/etc/powerdns
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 53
                  initialDelaySeconds: 30
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 53
                  initialDelaySeconds: 10
                  periodSeconds: 5
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - NET_BIND_SERVICE
                drop:
                  - ALL

    service:
      app:
        controller: powerdns-recursor
        type: LoadBalancer
        ports:
          dns-tcp:
            port: 53
            protocol: TCP
          dns-udp:
            port: 53
            protocol: UDP

    persistence:
      config:
        type: configMap
        name: powerdns-recursor-config
        globalMounts:
          - path: /etc/powerdns/recursor.conf
            subPath: recursor.conf
            readOnly: true
      forward-zones:
        type: emptyDir
        globalMounts:
          - path: /etc/powerdns/recursor.d
