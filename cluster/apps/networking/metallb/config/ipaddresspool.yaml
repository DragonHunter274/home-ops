---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default
  namespace: networking
spec:
  addresses:
    - ${CLUSTER_EXTERNAL_SUBNET_PREFIX}.100-${CLUSTER_EXTERNAL_SUBNET_PREFIX}.200
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: manual
  namespace: networking
spec:
  addresses:
    - ${CLUSTER_EXTERNAL_SUBNET_PREFIX}.20-${CLUSTER_EXTERNAL_SUBNET_PREFIX}.99
  autoAssign: false
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  namespace: networking
spec:
  ipAddressPools:
    - default
    - manual
