---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: networking
spec:
  interval: 30m
  chart:
    spec:
      chart: metallb
      version: 0.14.9
      sourceRef:
        kind: HelmRepository
        name: metallb-charts
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
    createNamespace: true
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controller:
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
    speaker:
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
