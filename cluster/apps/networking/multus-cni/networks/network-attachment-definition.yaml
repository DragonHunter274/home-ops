---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-static
  namespace: kube-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "capabilities": {
        "ips": true
      },
      "master": "enp3s0",
      "mode": "bridge",
      "ipam": {
        "type": "static"
      }
    }
