---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unbound
  namespace: networking
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      dnsPolicy: ClusterFirst
      dnsConfig:
        nameservers:
          - 10.43.0.10
        searches:
          - networking.svc.cluster.local
          - svc.cluster.local
          - cluster.local

    controllers:
      unbound:
        replicas: 3
        strategy: RollingUpdate
        initContainers:
          resolve-powerdns:
            image:
              repository: alpine
              tag: "3.19"
            command:
              - sh
              - -c
              - |
                set -e

                # Install kubectl
                apk add --no-cache curl
                curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
                chmod +x kubectl

                # Get PowerDNS service ClusterIP from Kubernetes API
                PDNS_IP=$(./kubectl get svc powerdns -n networking -o jsonpath='{.spec.clusterIP}')
                echo "Resolved PowerDNS to: $PDNS_IP"

                if [ -z "$PDNS_IP" ]; then
                  echo "ERROR: Failed to get PowerDNS service ClusterIP"
                  exit 1
                fi

                # Create stub zone config with the IP
                echo "stub-zone:" > /config/stub-zones.conf
                echo "    name: \"${SECRET_DEV_DOMAIN}\"" >> /config/stub-zones.conf
                echo "    stub-addr: $PDNS_IP" >> /config/stub-zones.conf

                echo "Stub zone config created:"
                cat /config/stub-zones.conf
        containers:
          app:
            image:
              repository: pedantic/unbound
              tag: "latest"
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                add:
                  - NET_BIND_SERVICE
                  - NET_RAW
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 53
                  initialDelaySeconds: 30
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 53
                  initialDelaySeconds: 10
                  periodSeconds: 5
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi

    service:
      app:
        controller: unbound
        type: LoadBalancer
        ports:
          dns-tcp:
            port: 53
            protocol: TCP
          dns-udp:
            port: 53
            protocol: UDP

    persistence:
      config:
        type: configMap
        name: unbound-config
        globalMounts:
          - path: /opt/unbound/etc/unbound/unbound.conf
            subPath: unbound.conf
            readOnly: true
      stub-zones:
        type: emptyDir
        globalMounts:
          - path: /config

    # Don't create serviceAccount - using manual one from rbac.yaml
    # The app-template should auto-detect and use the SA with the same name as controller
