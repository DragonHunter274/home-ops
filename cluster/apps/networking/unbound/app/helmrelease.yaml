---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unbound
  namespace: networking
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      dnsPolicy: ClusterFirst
      dnsConfig:
        nameservers:
          - 10.43.0.10
        searches:
          - networking.svc.cluster.local
          - svc.cluster.local
          - cluster.local

    controllers:
      unbound:
        replicas: 3
        strategy: RollingUpdate
        initContainers:
          resolve-powerdns:
            image:
              repository: busybox
              tag: "1.36"
            command:
              - sh
              - -c
              - |
                # Resolve PowerDNS service to IP using cluster DNS
                PDNS_IP=$(nslookup powerdns.networking.svc.cluster.local | grep -A1 "Name:" | tail -1 | awk '{print $3}')
                echo "Resolved PowerDNS to: $PDNS_IP"

                # Create stub zone config with the IP
                cat > /config/stub-zones.conf <<EOF
                stub-zone:
                    name: "${SECRET_DEV_DOMAIN}"
                    stub-addr: $PDNS_IP
                EOF

                cat /config/stub-zones.conf
        containers:
          app:
            image:
              repository: pedantic/unbound
              tag: "latest"
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                add:
                  - NET_BIND_SERVICE
                  - NET_RAW
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 53
                  initialDelaySeconds: 30
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 53
                  initialDelaySeconds: 10
                  periodSeconds: 5
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi

    service:
      app:
        controller: unbound
        type: LoadBalancer
        ports:
          dns-tcp:
            port: 53
            protocol: TCP
          dns-udp:
            port: 53
            protocol: UDP

    persistence:
      config:
        type: configMap
        name: unbound-config
        globalMounts:
          - path: /opt/unbound/etc/unbound/unbound.conf
            subPath: unbound.conf
            readOnly: true
      stub-zones:
        type: emptyDir
        globalMounts:
          - path: /config
