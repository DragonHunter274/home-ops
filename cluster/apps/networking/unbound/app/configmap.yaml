---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unbound-config
  namespace: networking
data:
  unbound.conf: |
    server:
      # Directory
      directory: "/opt/unbound/etc/unbound"

      # Listen on all interfaces
      interface: 0.0.0.0@53
      do-daemonize: no

      # Access control - allow all
      access-control: 0.0.0.0/0 allow

      # Performance tuning
      num-threads: 2
      msg-cache-size: 256m
      msg-cache-slabs: 4
      rrset-cache-size: 512m
      rrset-cache-slabs: 4
      cache-min-ttl: 60
      cache-max-ttl: 86400

      # Performance
      prefetch: yes
      prefetch-key: yes
      minimal-responses: yes
      so-reuseport: yes

      # Privacy and security
      hide-identity: yes
      hide-version: yes
      harden-glue: yes
      harden-large-queries: yes
      use-caps-for-id: no
      val-clean-additional: yes

      # DNSSEC
      auto-trust-anchor-file: "var/root.key"

      # Logging
      logfile: ""
      verbosity: 1
      log-queries: no
      log-replies: no

      # Include stub zones (generated by init container)
      include: /config/stub-zones.conf

    remote-control:
        control-enable: no
