---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unbound
  namespace: networking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unbound-service-reader
  namespace: networking
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unbound-service-reader
  namespace: networking
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: unbound-service-reader
subjects:
  - kind: ServiceAccount
    name: unbound
    namespace: networking
