---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: powerdns-admin
  namespace: networking
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      powerdns-admin:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: powerdnsadmin/pda-legacy
              tag: "v0.4.2"
            env:
              # Database configuration
              SQLALCHEMY_DATABASE_URI:
                valueFrom:
                  secretKeyRef:
                    name: powerdns-admin-secret
                    key: database-uri
              # Secret key for sessions
              SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: powerdns-admin-secret
                    key: secret-key
              # PowerDNS API configuration
              PDNS_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: powerdns-api-secret
                    key: api-key
              PDNS_VERSION: "5.0.1"
              # Point to PowerDNS service
              PDNS_API_URL: "http://powerdns.networking.svc.cluster.local:8081"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  failureThreshold: 60
                  periodSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  failureThreshold: 5
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  failureThreshold: 3
                  periodSeconds: 5
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 256Mi

    service:
      app:
        controller: powerdns-admin
        ports:
          http:
            port: 80
            protocol: TCP

    ingress:
      app:
        enabled: true
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/icon: dns
          hajimari.io/info: PowerDNS Admin
          hajimari.io/group: networking
        hosts:
          - host: pdns.${CLUSTER_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http

    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /data
