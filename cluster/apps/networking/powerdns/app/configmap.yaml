---
apiVersion: v1
kind: ConfigMap
metadata:
  name: powerdns-config
  namespace: networking
data:
  pdns.conf: |
    # Backend configuration
    launch=gpgsql
    gpgsql-host=powerdns-postgres-rw.networking.svc.cluster.local
    gpgsql-port=5432
    gpgsql-dbname=powerdns

    # API configuration
    api=yes
    webserver=yes
    webserver-address=0.0.0.0
    webserver-port=8081
    webserver-allow-from=0.0.0.0/0

    # Logging
    log-dns-details=yes
    log-dns-queries=no
    loglevel=4

    # Include credentials from separate file
    include-dir=/etc/powerdns/pdns.d
