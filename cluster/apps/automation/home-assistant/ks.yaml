---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-automation-home-assistant
  namespace: flux-system
  labels:
    substitution.flux.home.arpa/enabled: "true"
spec:
  path: ./cluster/apps/automation/home-assistant/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: home-assistant
      namespace: automation
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: home-assistant-db
      namespace: automation
  interval: 30m
  retryInterval: 1m
  timeout: 5m
